<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz: História do Futebol</title>
</head>
<body>
    <div class="caixa-principal">
        <div class="cabecalho">
            <h1>Lendas do Futebol 🏆</h1>
            <div class="marcador-placar" id="marcador-placar">Nível 1</div>
        </div>

        <div class="barra-progresso-container">
            <div class="barra-progresso" id="barra-progresso"></div>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <h2 class="titulo-resultado"></h2>
            <p class="texto-resultado"></p>
            <button class="btn-reiniciar" id="btn-proximo">Avançar para Próxima Rodada 🔥</button>
            <button class="btn-reiniciar btn-secundario" id="btn-reiniciar">Reiniciar do Zero 🔄</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
